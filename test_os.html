<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OneSignal Test</title>
    <!-- OneSignal SDK -->
    <script src="https://cdn.onesignal.com/sdks/OneSignalSDK.js" async=""></script>
    <script>
        // Screen logger
        function logToScreen(msg, color = 'black') {
            var log = document.getElementById('log');
            var p = document.createElement('div');
            p.style.color = color;
            p.innerText = "[" + new Date().toLocaleTimeString() + "] " + msg;
            log.appendChild(p);
        }

        window.onerror = function (msg, url, line) {
            logToScreen("ERROR: " + msg + " (" + url + ":" + line + ")", 'red');
            return false;
        };

        window.OneSignal = window.OneSignal || [];
        OneSignal.push(function () {
            logToScreen("OneSignal.push executing...", 'blue');

            try {
                OneSignal.init({
                    appId: "5fe0fa26-ccf5-46b2-8363-5a88755b87d5",
                    allowLocalhostAsSecureOrigin: true,
                    path: "/sarkari/",
                    promptOptions: {
                        slidedown: {
                            enabled: true,
                            autoPrompt: true,
                            timeDelay: 1,
                            pageViews: 1
                        }
                    },
                    notifyButton: {
                        enable: true,
                        position: 'bottom-right',
                        colors: {
                            'circle.background': '#dc2626',
                            'circle.foreground': 'white'
                        }
                    }
                }).then(function () {
                    logToScreen("OneSignal.init() Promise resolved.", 'green');
                }).catch(function (e) {
                    logToScreen("OneSignal.init() FAILED: " + JSON.stringify(e), 'red');
                });
            } catch (e) {
                logToScreen("Exception during init: " + e.message, 'red');
            }

            OneSignal.on('subscriptionChange', function (isSubscribed) {
                logToScreen("Event: subscriptionChange => " + isSubscribed);
            });

            // Check state
            OneSignal.isPushNotificationsEnabled(function (isEnabled) {
                logToScreen("isPushNotificationsEnabled: " + isEnabled);
            });
        });
    </script>
</head>

<body style="font-family: sans-serif; padding: 20px;">
    <h1>OneSignal Isolation Test</h1>
    <p>Please check the bottom-right corner for a RED BELL icon.</p>

    <div id="log"
        style="border:1px solid #ccc; padding:10px; height: 300px; overflow:auto; background:#f9f9f9; font-family:monospace;">
    </div>

    <hr>
    <p><small>Debug Info: AppID: 5fe0fa26-ccf5-46b2-8363-5a88755b87d5 | Path: /sarkari/</small></p>
</body>

</html>
